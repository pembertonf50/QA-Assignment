# Todo: This file is used to setup automated checks via github actions.
# Todo: The following config describes when and what we are checking before merging to main
name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.8, 3.9, 3.10]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
      run: |
        python manage.py test
    - name: Run Tests with Coverage
      run: |
        coverage report --omit=manage.py,myDjangoProject/settings.py --fail-under=100
    - name: Run Bandit Security Scan
      run: |
        bandit -r . -x ./testAccountExperience/tests.py
    - name: Run Safety Check
      run: |
        safety check --full-report